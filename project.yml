name: Antrum

options:
  bundleIdPrefix: com.coreyoneal
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
  configs:
    Debug:
      CODE_SIGNING_ALLOWED: NO
    Release:
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_STYLE: Automatic
      ENABLE_HARDENED_RUNTIME: YES

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: 0.15.4

targets:
  Antrum:
    type: application
    platform: macOS
    sources:
      - path: Sources
    entitlements:
      path: Sources/Antrum.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.calendars: true
    dependencies:
      - package: FluidAudio
        product: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreyoneal.Antrum
        PRODUCT_NAME: Antrum
        INFOPLIST_KEY_CFBundleDisplayName: Antrum
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Info.plist
      properties:
        NSMicrophoneUsageDescription: Antrum records your microphone locally for meeting transcripts and offline dictation.
        NSCalendarsFullAccessUsageDescription: Antrum can optionally read the calendar event that matches a recorded meeting and add its title, schedule, calendar, and location to your local Markdown transcript.

  AntrumTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AntrumTests
    dependencies:
      - target: Antrum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreyoneal.AntrumTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Antrum.app/Contents/MacOS/Antrum"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
